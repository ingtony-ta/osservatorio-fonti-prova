name: Prove dell'analista (modelli a confronto)

# Parte quando cambia prove/richiesta.json, oppure a mano. Non tocca lo stato dell'analista né il registro delle fonti.
on:
  push:
    paths:
      - "prove/richiesta.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrittura-esiti
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa il lettore di PDF
        run: pip install --quiet pypdf
      - name: Esegue le prove
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python prove/esegui_prove.py
      - name: Salva gli esiti nel repository
        if: always()
        run: |
          git config user.name "robot osservatorio"
          git config user.email "robot@users.noreply.github.com"
          git add prove/esiti
          git diff --cached --quiet || git commit -m "Esiti delle prove $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --quiet
          git push
